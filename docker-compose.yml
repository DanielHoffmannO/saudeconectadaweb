version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7000:5000"
    volumes:
      - ./data:/app/data
    environment:
      Jwt__Key: "${JWT_KEY}"
    restart: unless-stopped

  web:
    build:
      context: ./web
    ports:
      - "7002:80"
    depends_on:
      - api
    restart: unless-stopped
