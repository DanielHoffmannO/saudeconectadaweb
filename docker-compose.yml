version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/apache:/etc/apache2/sites-available
    environment:
      - DB_HOST=db
      - DB_NAME=saudeconectada
      - DB_USER=api_user
      - DB_PASSWORD=api_password
    depends_on:
      - db

